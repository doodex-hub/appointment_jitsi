name: appointment_jitsi_cvc

# Step 10 QA + Cross-Version Compare (templates/CROSS_VERSION_COMPARE.md) — appointment_jitsi.
#   odoo20 -> http://localhost:8097  (target: kode migration/20.0 di ../appointment_jitsi)
#   odoo19 -> http://localhost:8098  (source: snapshot `git archive migration/19.0` di scratchpad,
#             path di-set lewat env SRC19_ADDONS, read-only)
# Instance hidup (tanpa --stop-after-init), --http-interface=0.0.0.0 wajib (lihat knowledge
# 19-to-20 "Gotcha infrastruktur"), --without-demo=all supaya data dibuat manual & sama persis.
# Matikan dengan: COMPOSE_FILE=docker-compose.cvc.yml docker compose down -v

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - db-data-cvc:/var/lib/postgresql/data

  odoo20:
    image: appointment_jitsi_migration_20-odoo
    depends_on:
      - db
    environment:
      PGHOST: db
      PGUSER: odoo
      PGPASSWORD: odoo
    ports:
      - "8097:8069"
    volumes:
      - ../appointment_jitsi:/mnt/extra-addons/appointment_jitsi:ro
      - D:/Kuncoro/doodex/repo/odoo20:/opt/odoo:ro
      - D:/Kuncoro/doodex/repo/enterprise20:/mnt/enterprise:ro
    command: >
      -d qa20
      -i appointment_jitsi
      --addons-path=/opt/odoo/addons,/opt/odoo/odoo/addons,/mnt/enterprise,/mnt/extra-addons
      --http-interface=0.0.0.0
      --without-demo=all
      --db-filter=^qa20$$

  odoo19:
    build:
      context: ./cvc-19.0
      dockerfile: Dockerfile
    depends_on:
      - db
    environment:
      PGHOST: db
      PGUSER: odoo
      PGPASSWORD: odoo
    ports:
      - "8098:8069"
    volumes:
      - ${SRC19_ADDONS:?set SRC19_ADDONS ke folder hasil git archive migration/19.0}:/mnt/extra-addons:ro
      - D:/Kuncoro/doodex/repo/odoo19:/opt/odoo:ro
      - D:/Kuncoro/doodex/repo/enterprise19:/mnt/enterprise:ro
    command: >
      -d qa19
      -i appointment_jitsi
      --addons-path=/opt/odoo/addons,/opt/odoo/odoo/addons,/mnt/enterprise,/mnt/extra-addons
      --http-interface=0.0.0.0
      --without-demo=all
      --db-filter=^qa19$$

volumes:
  db-data-cvc:
