name: appointment_jitsi_migration_19_0_qa

services:
  db:
    # See docker-compose.19.0.yml for why pgvector is required at 19.0.
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - db-data-19-qa:/var/lib/postgresql/data

  odoo:
    image: odoo:19.0
    depends_on:
      - db
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    ports:
      - "8095:8069"
    volumes:
      - ../appointment_jitsi:/mnt/extra-addons/appointment_jitsi
      - D:/Kuncoro/doodex/repo/enterprise19.0/odoo/addons:/mnt/enterprise-addons:ro
    command: >
      odoo -d appointment_jitsi_qa_19
      -i appointment_jitsi
      --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/enterprise-addons,/mnt/extra-addons
      --without-demo=all

volumes:
  db-data-19-qa:
